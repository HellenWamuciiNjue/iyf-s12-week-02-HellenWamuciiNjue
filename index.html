<!DOCTYPE html> <!-- This tells my browser: Hey, get ready! I am writing a modern HTML5 webpage. -->
<html lang="en"> <!-- This tells the computer that everything on this page is written in English. -->
<head> <!-- This opens up my invisible settings drawer. -->
    
    <meta charset="UTF-8"> 
    <!-- REMEMBER: The line above is a safety rule. It ensures special characters like emojis don't turn into broken squares! -->
    
    <title>Hellen Wamucii Njue | Week 2 CSS</title> <!-- This is the text that appears on my browser's top tab. -->
    
    <link rel="stylesheet" href="styles.css"> 
    <!-- 🌟 MAGIC LINK: Connects my HTML to my empty styles.css sheet so my colors and fonts render cleanly! -->

</head> <!-- This puts a slash / on the tag to cleanly close our settings drawer. -->
<body> <!-- This kicks off the visible part of my web page where content actually shows up! -->

    <!-- ==================== LAYER 2: THE HEADER ==================== -->
    <header> <!-- This creates a semantic welcome box or introduction tray at the top of my page. -->
        <h1>Hellen Wamucii Njue Portfolio</h1> <!-- Giant main title header. I only use ONE h1 per page! -->
        <p>Learning how to style webpages using CSS!</p> <!-- Standard paragraph block for sentence reading text. -->
    </header> <!-- This cleanly seals off my top welcome tray. -->

    <!-- ==================== LAYER 3: THE MAIN CONTENT ==================== -->
    <main> <!-- This tells search engines: The most important unique information lives inside here. -->
        <section> <!-- This creates an organized chapter or thematic section box inside my main space. -->
            <h2>Task 3.1: CSS Setup & Basic Styling</h2> <!-- Medium-sized sub-header. Slightly smaller than my h1 title. -->
            <p>I am typing this code line by line to master web design.</p> <!-- Another reading paragraph block. -->
        </section> <!-- Closes down my organized chapter box. -->
    </main> <!-- Closes down my main unique content room. -->

    <!-- ==================== LAYER 4: THE BASE FOOTER ==================== -->
    <footer> <!-- This creates a clean metadata strip at the absolute bottom of the screen. -->
        <p>&copy; 2026 Hellen Wamucii Njue.</p> <!-- The &copy; code automatically creates a clean copyright circle symbol (©). -->
    </footer> <!-- Closes down my bottom baseline strip. -->

</body> <!-- Locks the main visible content doors of the webpage. -->
</html> <!-- The absolute final anchor that tells the computer: That's all folks! The entire document is finished. -->

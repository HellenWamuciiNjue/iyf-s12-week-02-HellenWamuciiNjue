<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Get In Touch - Hellen Wamucii</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Basic contact page layout with form fields -->
   <header>
    <!-- Task 4.1: Unified Flexbox Navigation Menu -->
    <nav class="nav-container">
        <div class="logo">Hellen.Dev</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="box-model-practice.html">Box Model Practice</a></li>
        </ul>
    </nav>
</header>
  <main>
    <h2>Contact Me</h2>
    <form action="#" method="POST">
      <fieldset>
        <legend>Contact Form</legend>
        <p>
          <label for="username">Full Name:</label>
          <input type="text" id="username" name="fullname" required>
        </p>
        <p>
          <label for="useremail">Email:</label>
          <input type="email" id="useremail" name="email" required>
        </p>
        <p>
          <label for="msg-box">Message:</label><br>
          <textarea id="msg-box" name="message" rows="5" minlength="50" required></textarea>
        </p>
        <p>
          <button type="submit">Submit</button>
        </p>
      </fieldset>
    </form>
  </main>
</body>
</html>

<!DOCTYPE html> <!-- Telling my browser that I am writing HTML5 webpage. -->
<html lang="en"> <!-- Telling the computer that everything on this page is written in English. -->
<head> <!-- This opens the settings drawer for my webpage. -->
    <meta charset="UTF-8"> <!-- This line is a safety rule. It ensures special characters like emojis don't turn into broken squares! -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This line is a safety rule. It ensures my webpage looks good on all devices, from phones to desktops. -->
    <title>Hellen Wamucii Njue</title> <!-- This is the text that appears on my browser's top tab. -->
    <link rel="stylesheet" href="styles.css"> <!-- This links my webpage to the CSS file for styling. -->
</head>
<body> <!-- Starting the visible part of my web page. -->

<header> <!-- Welcome header tray box. -->
        <h1>Task 3.2: Box Model Practice Dashboard</h1> <!-- Main headline title. -->
        <p>Mastering Content, Padding, Borders, and Margins layout spacing rules.</p> <!-- Reading block text. -->
    </header> <!-- Closing the welcome tray. -->

    <main> <!-- Main unique content room wrapper. -->
        <!-- We will put our Exercise 1, 2, and 3 practice blocks in here next! -->
                 <!-- Exercise 1: Box Model Visualization Elements -->
        <section class="box-section">
            <h2>Exercise 1: The Four Box Layout</h2>
            
            <div class="box content-box">Content Area Box</div>
            <div class="box padding-box">Padding Cushion Box</div>
            <div class="box border-box">Visible Frame Border Box</div>
            <div class="box margin-box">External Air Gap Margin Box</div>
        </section>
<!-- 👶 Why did we use class="..."?A class is like giving an element a distinct name tag. Instead of styling every single div on your webpage the exact same way, assigning unique classes like class="content-box" allows you to target specific containers cleanly inside your stylesheet. -->
    </main> <!-- Closing the content room. -->

</body>
</html>
